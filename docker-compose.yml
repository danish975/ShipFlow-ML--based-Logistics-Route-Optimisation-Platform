version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shipflow-postgres
    environment:
      POSTGRES_DB: shipflow
      POSTGRES_USER: shipflow
      POSTGRES_PASSWORD: shipflow_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shipflow']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shipflow-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: shipflow-api
    ports:
      - '3001:3001'
    environment:
      - DATABASE_URL=postgresql://shipflow:shipflow_dev@postgres:5432/shipflow?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - ./prisma:/app/prisma

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: shipflow-web
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_WS_URL=http://localhost:3001
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public

  ml-service:
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
    container_name: shipflow-ml
    ports:
      - '8000:8000'
    environment:
      - ML_API_KEY=ml-service-api-key-change-this
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/ml-service:/app
      - ml_models:/app/models

volumes:
  postgres_data:
  redis_data:
  ml_models:
